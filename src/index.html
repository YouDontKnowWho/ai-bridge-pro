<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AI Bridge Pro</title>
    <style>
        body { margin: 0; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
        .panel { padding: 8px; }
        .tabs { display: flex; border-bottom: 1px solid #ccc; margin-bottom: 8px; }
        .tab { padding: 6px 8px; cursor: pointer; border-bottom: 2px solid transparent; }
        .tab.active { border-bottom-color: #007acc; }
        .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
        label { min-width: 80px; font-weight: 500; }
        input, select, textarea { padding: 4px; border: 1px solid #ccc; border-radius: 3px; }
        textarea { width: 100%; min-height: 60px; resize: vertical; }
        button { padding: 6px 12px; background: #007acc; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background: #005a9e; }
        .badge { background: #f0f0f0; padding: 2px 6px; border-radius: 2px; font-size: 10px; }
        .scroll { max-height: 300px; overflow-y: auto; }
        .list-item { padding: 8px; border: 1px solid #eee; margin-bottom: 4px; border-radius: 3px; }
        h4 { margin: 12px 0 8px; }
    </style>
</head>
<body>
    <div id="root"></div>
</body>
</html>
